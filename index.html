<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Rewards Controller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #18181b;
            color: #fff;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn-twitch {
            background-color: #9146ff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-twitch:hover { background-color: #772ce8; }
        #log {
            background: #0f0f11;
            border: 1px solid #3f3f46;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            border-radius: 5px;
            margin-top: 15px;
        }
        .reward-alert { color: #a970ff; font-weight: bold; margin-bottom: 8px; }
        .hidden { display: none; }
        #status { font-weight: bold; color: #ff4a4a; }
    </style>
</head>
<body>

    <h1>Управление наградами Twitch</h1>
    
    <!-- Кнопка авторизации -->
    <div id="auth-section">
        <p>Для начала работы необходимо авторизоваться через Twitch:</p>
        <button class="btn-twitch" onclick="loginWithTwitch()">Войти через Twitch</button>
    </div>

    <!-- Панель управления (скрыта до авторизации) -->
    <div id="main-section" class="hidden">
        <p>Привет, <b id="user-name">...</b>!</p>
        <p>Статус: <span id="status">Инициализация...</span></p>
        <h3>Лог выкупленных наград:</h3>
        <div id="log"></div>
    </div>

    <script>
        // --- НАСТРОЙКА ---
        const CLIENT_ID = 'YOUR_CLIENT_ID'; // Вставьте сюда ваш Client ID с Twitch Developer Console
        const REDIRECT_URI = window.location.origin + window.location.pathname; 
        const SCOPES = 'channel:read:redemptions';

        let accessToken = null;
        let broadcasterId = null;
        let ws;

        // Перенаправление пользователя на Twitch для авторизации
        function loginWithTwitch() {
            const authUrl = `https://twitch.tv` +
                            `?client_id=${CLIENT_ID}` +
                            `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                            `&response_type=token` +
                            `&scope=${encodeURIComponent(SCOPES)}`;
            window.location.href = authUrl;
        }

        // Проверка URL на наличие токена после возвращения от Twitch
        async function checkAuth() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                accessToken = params.get('access_token');
                
                if (accessToken) {
                    // Очищаем хэш в адресной строке для красоты
                    window.history.replaceState({}, document.title, window.location.pathname);
                    
                    // Показываем основной интерфейс
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('main-section').classList.remove('hidden');
                    
                    // Получаем данные о пользователе (его ID и логин)
                    await getUserData();
                }
            }
        }

        // Автоматический запрос информации о стримере по токену
        async function getUserData() {
            try {
                const response = await fetch('https://twitch.tv', {
                    headers: {
                        'Client-ID': CLIENT_ID,
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                const data = await response.json();
                if (data.data && data.data.length > 0) {
                    const user = data.data[0];
                    broadcasterId = user.id;
                    document.getElementById('user-name').innerText = user.display_name;
                    
                    // Запускаем WebSocket после получения ID
                    connectTwitch();
                }
            } catch (err) {
                console.error('Ошибка получения данных пользователя:', err);
                alert('Не удалось получить данные аккаунта.');
            }
        }

        // Подключение к WebSocket EventSub
        function connectTwitch() {
            ws = new WebSocket('wss://eventsub.wss.twitch.tv/v1');

            ws.onopen = () => {
                updateStatus('Подключено к WebSocket. Ожидание сессии...', '#cfbcff');
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.metadata.message_type === 'session_welcome') {
                    const sessionId = data.payload.session.id;
                    updateStatus('Сессия создана. Подписка на награды...', '#cfbcff');
                    await subscribeToRewards(sessionId);
                }

                if (data.metadata.message_type === 'notification' && data.payload.subscription.type === 'channel.channel_points_custom_reward_redemption.add') {
                    handleReward(data.payload.event);
                }
            };

            ws.onclose = () => {
                updateStatus('Отключено. Переподключение...', '#ff4a4a');
                setTimeout(connectTwitch, 5000);
            };
        }

        // Подписка на награды
        async function subscribeToRewards(sessionId) {
            try {
                const response = await fetch('https://twitch.tv', {
                    method: 'POST',
                    headers: {
                        'Client-ID': CLIENT_ID,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'channel.channel_points_custom_reward_redemption.add',
                        version: '1',
                        condition: { broadcaster_user_id: broadcasterId },
                        transport: {
                            method: 'websocket',
                            session_id: sessionId
                        }
                    })
                });

                if (response.ok) {
                    updateStatus('Успешно работает! Ожидание активации наград...', '#00ff66');
                } else {
                    const errData = await response.json();
                    updateStatus('Ошибка подписки: ' + errData.message, '#ff4a4a');
                }
            } catch (err) {
                updateStatus('Ошибка сети при подписке', '#ff4a4a');
            }
        }

        function updateStatus(text, color) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = text;
            statusEl.style.color = color;
        }

        // Обработка триггеров
        function handleReward(event) {
            const userName = event.user_name;
            const rewardTitle = event.reward.title;
            const userInput = event.user_input || '';

            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div class="reward-alert">[${new Date().toLocaleTimeString()}] <b>${userName}</b> взял "${rewardTitle}" ${userInput ? `(${userInput})` : ''}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;

            // --- ВАШИ СЦЕНАРИИ ---
            if (rewardTitle.toLowerCase() === 'тест') {
                alert(`Пользователь ${userName} активировал тестовую награду!`);
            }
        }

        // Проверяем авторизацию при загрузке страницы
        checkAuth();
    </script>
</body>
</html>
